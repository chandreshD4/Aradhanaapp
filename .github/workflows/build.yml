name: Build Cordova APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project & Build
      run: |
        cordova create myApp com.aradhna.app Aradhana
        cd myApp
        cordova platform add android
        cordova plugin add admob-plus-cordova --variable APP_ID_ANDROID="ca-app-pub-3940256099942544~3347511713"
        cordova plugin add cordova-plugin-media
        rm -rf www/*
        if [ -d "../app/src/main/assets" ]; then
          cp -r ../app/src/main/assets/* www/
        else
          cp -r ../* www/ 2>/dev/null || true
          rm -rf www/myApp www/.git www/.github
        fi
        if [ -f www/config.xml ]; then cp www/config.xml config.xml; fi
        if [ -f www/om-logo.jpg ]; then cp www/om-logo.jpg om-logo.jpg; fi
        cordova build android --verbose

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Aradhana-Installable-APK
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
